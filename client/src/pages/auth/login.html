<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../../assets/lambda.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DayNight Admin</title>
    <script>if(localStorage.getItem("daynight-theme")==="carbon"){document.documentElement.classList.add("carbon");}</script>
    <link rel="stylesheet" href="../../style/templatemo-daynight-style.css">
    <!--

TemplateMo 608 DayNight Admin

https://templatemo.com/tm-608-daynight-admin

-->
</head>
<body>
    <!-- Login Page -->
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="../../assets/logo.svg" style="width: 50%;">
                    </div>
                    <div id="login-success-indicator" class="login-success-indicator" style="display: none;" role="img" aria-label="Login successful">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>
                    <h1 id="login-title" class="login-title">Welcome back</h1>
                    <p id="login-subtitle" class="login-subtitle">Sign in to your account to continue</p>
                    <p id="login-status-announcement" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
                </div>
 
                <div id="error-display" class="error-display" style="display: none; background-color: #fee2e2; border: 1px solid #ef4444; color: #dc2626; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;">
                    <span id="error-message"></span>
                </div>

                <form class="login-form" id="login-form">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com">
                    </div>
                    
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label class="form-label" style="margin-bottom: 0;">Password</label>
                            <a href="forgot-password.html" style="font-size: 0.8125rem; color: var(--accent);">Forgot password?</a>
                        </div>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        Sign In
                    </button>
                </form>

                <p class="login-footer">
                    Don't have an account? <a href="#">Sign up for free</a>
                </p>

                <hr style="margin: 1.5rem 0; width: 50%;">

                <p style="text-align: center; font-size: 0.8125rem; color: var(--text-secondary);">
                &copy; 2026 Terminal Velocity Development
                </p>
            </div>
        </div>
    </div>

    <script src="../../style/templatemo-daynight-script.js"></script>
    <script src="/dist/auth/login.bundle.js"></script>
</body>
</html>
