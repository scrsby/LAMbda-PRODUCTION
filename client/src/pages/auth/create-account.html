<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - LAMbda Admin</title>
    <script>if(localStorage.getItem("daynight-theme")==="carbon"){document.documentElement.classList.add("carbon");}</script>
    </style>
    <link rel="stylesheet" href="../../style/templatemo-daynight-style.css">
</head>
<body>
    <!-- Login Page -->
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="../../assets/logo.svg" style="width: 50%;">
                    </div>
                    <h1 class="login-title">Create Your Account</h1>
                    <p class="login-subtitle">Fill in your details to get started</p>
                </div>

                <form class="login-form" id="create-account-form">
                    <div class="form-group">
                        <label class="form-label">Access Token</label>
                        <input type="text" id="access-token" class="form-input" placeholder="Enter your access token" required>
                    </div>


                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Repeat Password</label>
                        <input type="password" id="repeat-password" class="form-input" placeholder="Repeat your password" required>
                    </div>

                    <div class="error-message" id="error-message" style="display: none; padding: 12px; background-color: #fee; border: 1px solid #fcc; border-radius: 6px; color: #c33; margin-bottom: 1rem; font-size: 0.875rem;"></div>

                    <button type="submit" class="btn btn-primary">
                        Create Account
                    </button>
                </form>

                <p class="login-footer">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>

                <hr style="margin: 1.5rem 0; width: 50%;">

                <p style="text-align: center; font-size: 0.8125rem; color: var(--text-secondary);">
                &copy; 2026 Terminal Velocity Development
                </p>
            </div>

        </div>
    </div>
    <script src="../../style/templatemo-daynight-script.js"></script>
    <script src="/dist/auth/create-account.bundle.js"></script>
</body>
</html>
