<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../../assets/lambda.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LAMbda Admin</title>
    <script>if(localStorage.getItem("daynight-theme")==="carbon"){document.documentElement.classList.add("carbon");}</script>
    <link rel="stylesheet" href="../../style/templatemo-daynight-style.css">
</head>
<body>
    <!-- Reset Password Page -->
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="../../assets/lambda.svg" style="width: 50%;">
                    </div>
                    <h1 class="login-title">Reset Password</h1>
                </div>

                <div id="invalid-link-message" style="display: none; padding: 16px; background-color: #fee; border: 1px solid #fcc; border-radius: 6px; color: #c33; font-size: 0.9375rem; text-align: center;">
                    This reset link is invalid or has expired. Please <a href="forgot-password.html">request a new one</a>.
                </div>

                <form class="login-form" id="reset-password-form">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" id="new-password" class="form-input" placeholder="Enter your new password" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Repeat New Password</label>
                        <input type="password" id="repeat-new-password" class="form-input" placeholder="Repeat your new password" required>
                    </div>

                    <div class="error-message" id="error-message" style="display: none; padding: 12px; background-color: #fee; border: 1px solid #fcc; border-radius: 6px; color: #c33; margin-bottom: 1rem; font-size: 0.875rem;"></div>

                    <button type="submit" class="btn btn-primary">
                        Reset Password
                    </button>
                </form>

                <div id="success-message" style="display: none; padding: 16px; background-color: #efe; border: 1px solid #cfc; border-radius: 6px; color: #363; font-size: 0.9375rem; text-align: center; margin-top: 1rem;">
                    Your password has been reset successfully. Redirecting to login...
                </div>

                <hr style="margin: 1.5rem 0; width: 50%;">

                <p style="text-align: center; font-size: 0.8125rem; color: var(--text-secondary);">
                &copy; 2026 Terminal Velocity Development
                </p>
            </div>

        </div>
    </div>
    <script src="../../style/templatemo-daynight-script.js"></script>
    <script src="/dist/auth/reset-password.bundle.js"></script>
</body>
</html>
