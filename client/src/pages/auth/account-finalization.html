<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - DayNight</title>
    <script>if(localStorage.getItem("daynight-theme")==="carbon"){document.documentElement.classList.add("carbon");}</script>
    <link rel="stylesheet" href="../../style/templatemo-daynight-style.css">
</head>
<body>
    <!-- Account Finalization Page -->
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <img src="../../assets/logo.svg" style="width: 50%;">
                    </div>
                    <h1 class="login-title">Complete Your Profile</h1>
                    <p class="login-subtitle">Please provide your information to finish setting up your account</p>
                </div>

                <form class="login-form" id="finalization-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" id="first-name" class="form-input" placeholder="John">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" id="last-name" class="form-input" placeholder="Doe">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-input" placeholder="(555) 123-4567">
                    </div>
                    
                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button type="button" id="skip-btn" class="btn" style="flex: 1; background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border-color);">
                            Skip for Now
                        </button>
                        <button type="submit" class="btn btn-primary" style="flex: 1;">
                            Save Profile
                        </button>
                    </div>
                </form>

                <p class="login-footer" style="margin-top: 1.5rem;">
                    You can always update this information later in your account settings.
                </p>
            </div>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem; color: var(--text-secondary);">
                &copy; 2026 Terminal Velocity Development. All rights reserved.
            </p>
        </div>
    </div>

    <script src="../../style/templatemo-daynight-script.js"></script>
    <script src="/dist/auth/account-finalization.bundle.js"></script>
</body>
</html>
