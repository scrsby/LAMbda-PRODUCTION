<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../assets/lambda.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Lawrence Antique Mall</title>
    <script>
        if (localStorage.getItem('daynight-theme') === 'carbon') {
            document.documentElement.classList.add('carbon');
        }
    </script>
    <link rel="stylesheet" href="../style/templatemo-daynight-style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="nav-container">
                <div class="nav-left">
                    <a href="#" id="logo-link" class="logo"><div class="logo-icon"><img src="../assets/lambda.svg" alt="LAM logo"></div>Lawrence Antique Mall</a>
                </div>
                <div class="nav-right">
                    <div class="theme-toggle">
                        <button class="theme-btn theme-btn-snow active" onclick="setTheme('snow')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
                        <button class="theme-btn theme-btn-carbon" onclick="setTheme('carbon')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
                    </div>
                    <button class="user-menu" style="cursor: default;"><div class="user-avatar" style="visibility:hidden;"></div><span class="user-name" style="visibility:hidden;"></span></button>
                    <a href="#" class="btn-logout" title="Logout" id="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div class="card" style="display: flex; flex-direction: row; align-items: stretch; padding: 0; overflow: hidden;">
                    <div style="flex: 1; padding: 1.25rem 1.5rem; display: flex; align-items: center;">
                        <h1 class="greeting" style="margin: 0;">Profile Settings</h1>
                    </div>
                    <div style="width: 1px; background: var(--border-color); box-shadow: 2px 0 6px rgba(0,0,0,0.12); flex-shrink: 0;"></div>
                    <div style="padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <button class="btn btn-primary" id="back-btn">Back</button>
                    </div>
                </div>
            </div>

            <!-- Profile Information -->
            <section class="settings-section">
                <div class="card">
                    <h2 class="settings-title">Profile Information</h2>
                    <p class="settings-desc">Update the name that displays on your account</p>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">First Name</label>
                            <input type="text" id="first-name" class="form-input" placeholder="First name">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Last Name</label>
                            <input type="text" id="last-name" class="form-input" placeholder="Last name">
                        </div>
                    </div>

                    <button class="btn btn-primary" id="save-name-btn">Save Changes</button>

                    <div class="error-message" id="error-message" style="display: none; padding: 12px; background-color: #fee; border: 1px solid #fcc; border-radius: 6px; color: #c33; margin-top: 1rem;"></div>
                    <div class="success-message" id="success-message" style="display: none; padding: 12px; background-color: #efe; border: 1px solid #cfc; border-radius: 6px; color: #3c3; margin-top: 1rem;"></div>
                </div>
            </section>

            <!-- Profile Color -->
            <section class="settings-section">
                <div class="card">
                    <h2 class="settings-title">Profile Color</h2>
                    <p class="settings-desc">Choose the color that displays on your profile avatar</p>

                    <div class="color-swatch-grid" id="color-swatch-grid"></div>
                </div>
            </section>
        </main>

        <footer class="footer"><p>&copy; 2026 Lawrence Antique Mall</p></footer>
    </div>
    <script src="../style/templatemo-daynight-script.js"></script>
    <script src="/dist/user-settings.bundle.js"></script>
</body>
</html>
