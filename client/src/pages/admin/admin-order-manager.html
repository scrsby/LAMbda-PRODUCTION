        <!-- Main Content -->
        <main class="main-content">

            <!-- Search & Filter Bar -->
            <div class="card" style="margin-bottom: 0.75rem;">
                <div class="section-header-row">
                    <h2 class="settings-title">Orders</h2>
                </div>
                <div class="ticket-toolbar">
                    <label class="ticket-toolbar-field">
                        Order ID
                        <input type="text" id="filter-id" placeholder="Search by order ID...">
                    </label>
                    <label class="ticket-toolbar-field">
                        Search Items
                        <input type="text" id="search-items" placeholder="Search by item description...">
                    </label>
                    <label class="ticket-toolbar-field">
                        Start Time
                        <input type="datetime-local" id="filter-start">
                    </label>
                    <label class="ticket-toolbar-field">
                        End Time
                        <input type="datetime-local" id="filter-end">
                    </label>
                    <label class="ticket-toolbar-field">
                        Employee
                        <input type="text" id="filter-employee" placeholder="Filter by employee...">
                    </label>
                    <div class="ticket-toolbar-actions">
                        <button type="button" class="btn btn-primary" id="search-btn">Search</button>
                        <button type="button" class="btn btn-secondary" id="clear-btn">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="card">
                <div style="overflow-x: auto;">
                    <table id="orders_table" class="display responsive nowrap" style="width: 100%;">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date / Time</th>
                                <th>Employee</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="orders_list">
                        </tbody>
                    </table>
                </div>
            </div>
